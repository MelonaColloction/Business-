name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Create clean Flutter project
        run: |
          mkdir build_project
          cd build_project
          flutter create --platforms=android --project-name business_manager .
          rm -rf lib
          mkdir lib
          cp ../lib/main.dart lib/main.dart
          cp ../lib/app.dart lib/app.dart
          cp ../pubspec.yaml pubspec.yaml

      - name: Get dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Analyze
        working-directory: build_project
        run: flutter analyze

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-manager-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
