name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Create Flutter project
        run: |
          mkdir /tmp/flutter_app
          cd /tmp/flutter_app
          flutter create --platforms=android --org com.businessmanager business_manager

      - name: Copy application files
        run: |
          cp lib/main.dart /tmp/flutter_app/business_manager/lib/main.dart
          cp lib/app.dart /tmp/flutter_app/business_manager/lib/app.dart

          if [ -f pubspec.yaml ]; then
            cp pubspec.yaml /tmp/flutter_app/business_manager/pubspec.yaml
          fi

      - name: Build APK
        working-directory: /tmp/flutter_app/business_manager
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business-Manager-APK
          path: /tmp/flutter_app/business_manager/build/app/outputs/flutter-apk/app-release.apk
